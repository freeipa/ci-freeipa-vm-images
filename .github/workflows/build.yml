name: Build and publish VM images

# One job per (image, arch) in images.yaml: fetch the upstream cloud image,
# bring it up to date (Fedora: with updates-testing), install a FreeIPA
# server on it with ci-freeipa, and push it to the registry of this
# repository as ghcr.io/<owner>/<repo>/<image>:<date>-<arch>. The manifest
# job then merges the arches of one image into a multi-arch manifest list
# under ghcr.io/<owner>/<repo>/<image>:latest, so one preset ref works on
# every host architecture.
#
# An entry without `update` (the aarch64 lanes today) skips the update and
# the FreeIPA test and publishes the checksum-verified upstream image.

on:
  schedule:
    - cron: '17 3 * * 1'        # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma separated image names from images.yaml (default: all)'
        required: false
        default: ''
      publish:
        description: 'Publish the images that pass'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['scripts/**', 'images.yaml', '.github/workflows/build.yml']
  pull_request:
    paths: ['scripts/**', 'images.yaml', '.github/workflows/build.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # the checkout of ci-freeipa that runs the test; set repository variables
  # CI_FREEIPA_REPO / CI_FREEIPA_REF to use another
  CI_FREEIPA_REPO: ${{ vars.CI_FREEIPA_REPO || 'freeipa/ci-freeipa' }}
  CI_FREEIPA_REF: ${{ vars.CI_FREEIPA_REF || 'main' }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          # a pull request tries one image; a manual run may name some
          ONLY: ${{ github.event_name == 'pull_request' && 'fedora-45' || inputs.only }}
        run: echo "matrix=$(python3 scripts/matrix.py --only "$ONLY")" >> "$GITHUB_OUTPUT"

  image:
    needs: matrix
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    # an experimental image may fail without failing the workflow; a failed
    # image is never published either way
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    env:
      NAME: ${{ matrix.name }}
      ARCH: ${{ matrix.arch }}
      PACKAGES: ${{ matrix.packages }}
      UPDATE: ${{ matrix.update }}
      WORK: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the host
        run: |
          # azure.archive.ubuntu.com, the runner's default mirror (listed in
          # /etc/apt/apt-mirrors.txt and redirected to from security.ubuntu.com),
          # sometimes does not resolve: use the main archive from the start
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
              /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
              /etc/apt/sources.list.d/* 2>/dev/null || true
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          # qemu-img for publish.sh; podman to push the containerdisk
          pkgs="qemu-utils podman python3-yaml"
          # the update boots the image under qemu of the entry's arch; an
          # entry without `update` (published as fetched) needs none of it
          [ -n "$UPDATE" ] && pkgs="$pkgs qemu-system-x86 qemu-system-arm \
              qemu-efi-aarch64 xorriso rsync openssh-client"
          for attempt in 1 2 3; do
              # shellcheck disable=SC2086
              sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --no-install-recommends $pkgs && break
              [ "$attempt" = 3 ] && { echo "::error::apt is unreachable"; exit 1; }
              # Canonical's hosts have had outages: use kernel.org's mirror
              # for every pocket, security included
              echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo sed -i -E 's#https?://([a-z]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' \
                  /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
              sleep 10
          done
          # the VMs of the test authorize the runner's ssh key
          [ -e ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          mkdir -p "$WORK"

      - name: Prepare KVM
        if: matrix.update != ''
        run: |
          # let the runner user use KVM; load the module first, since a
          # runner may not have loaded it
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          for _ in $(seq 15); do [ -w /dev/kvm ] && break; sleep 2; done
          if [ ! -w /dev/kvm ]; then
              echo "::group::KVM diagnostics"
              ls -l /dev/kvm* 2>&1 || true
              grep -c -E 'vmx|svm' /proc/cpuinfo || true
              lscpu | grep -i -E 'model name|hypervisor|virtualization' || true
              lsmod | grep -i kvm || true
              echo "::endgroup::"
              echo "::error::/dev/kvm is not available on this runner (no nested virtualization)"
              exit 1
          fi

      - name: Fetch the upstream image
        run: |
          scripts/fetch-image.sh "${{ matrix.distro }}" "${{ matrix.release }}" "$WORK" "$ARCH"
          sed "s/'//g" "$WORK/base.env" >> "$GITHUB_ENV"

      - name: Bring it up to date
        if: matrix.update != ''
        run: scripts/update-image.sh "$BASE_FILE" "$WORK/image.qcow2" "$UPDATE" "$WORK/report"

      - name: Record what the update changed
        if: matrix.update != ''
        run: |
          {
            echo "### $NAME ($ARCH)"
            echo "Base: \`$BASE_NAME\` (sha256 \`$BASE_SHA256\`)"
            echo "Update: \`$UPDATE\`"
            echo "Packages added or changed: $(wc -l < "$WORK/report/updated.txt")"
            echo '<details><summary>List</summary>'; echo; echo '```'
            cat "$WORK/report/updated.txt"
            echo '```'; echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out ci-freeipa
        if: matrix.update != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CI_FREEIPA_REPO }}
          ref: ${{ env.CI_FREEIPA_REF }}
          path: ci-freeipa

      - name: Test - install a FreeIPA server on the image
        if: matrix.update != ''
        run: |
          preset="$WORK/preset.yaml"
          scripts/render-preset.py --name "$NAME" --image "$WORK/image.qcow2" \
              --packages "$PACKAGES" > "$preset"
          cli=ci-freeipa/env/freeipa-env
          wd=(--workdir "$WORK/env")
          rc=0
          "$cli" up "$preset" "${wd[@]}" && "$cli" run "$preset" "${wd[@]}" || rc=$?
          "$cli" summary "$preset" "${wd[@]}" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          "$cli" down "$preset" "${wd[@]}" || true
          exit $rc

      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            work/env/logs
            work/report
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish
        # only an image that passed, from the default branch, on request or
        # on schedule
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/$repo/$NAME"
          today="$(date -u +%Y%m%d)"
          # without an update there is no updated image: publish the
          # verified upstream image as it was fetched
          disk="$WORK/image.qcow2"
          [ -n "$UPDATE" ] || disk="$BASE_FILE"
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" IMAGE_VERSION="$today" \
              scripts/publish.sh --push "$disk" "$ref:$today-$ARCH"
          {
            echo "Published \`$ref:$today-$ARCH\` (merged into \`$ref:latest\` by the manifest job). Use it in a ci-freeipa preset:"
            echo '```yaml'; echo "vm:"; echo "  image: containerdisk:$ref:latest"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Merge the per-arch tags of one image name into one multi-arch manifest
  # list, so a preset uses one ref on every host architecture. An arch this
  # run did not publish keeps its previous member (by digest): a failing
  # arch never drops another arch from `latest`.
  manifest:
    needs: image
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3-yaml
      - name: Merge the per-arch tags into multi-arch lists
        env:
          ONLY: ${{ inputs.only || '' }}
        run: |
          matrix="$(python3 scripts/matrix.py --only "$ONLY")"
          MATRIX="$matrix" REPO="$GITHUB_REPOSITORY" scripts/merge-manifests.sh
