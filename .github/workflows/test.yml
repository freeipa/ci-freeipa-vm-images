name: Checks

# Fast checks of the scripts and workflows; they do not build an image.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils python3-pytest python3-yaml shellcheck
      - name: Shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck scripts/*.sh
      - name: Workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint
      - name: Tests
        run: python3 -m pytest tests -q
